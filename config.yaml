setup:
  gpu_id: '-1'
  seed: 2024

  file_name: your_run_file_name
  model_type: DReAM-SAM   # DReAM-SAM, vit_b (default)
  model_name: LoRA   # SAM, LoRA
  weight_type: sam_vit_b_01ec64.pth

  data_type: your_dataset
  cls: <num_classes>    # Change depending on the 'data_type'
  num_regions: <num_classes+1>
  
network:
  Prompt: # True, False
    Point: True
    Box: False
    Mask: True
    grid: False
    nnUNetMask: False
  Update: # True(=Trainable), False(=Freeze)
    image_encoder: False
    prompt_encoder: False
    mask_decoder: True

loss:   # L_total = L_seg + L_cls + kd_weight * L_kd + lambda_rd * L_rd
  lambda_rd: 0.5      # lambda for the region decoupling loss
  kd_weight: 1.0      # weight for the kernel decorrelation loss
  tau_c: 0.2          # affinity temperature of the KD loss
  detach_affinity: True    # freeze w_nm so prototypes cannot shortcut the penalty
  cosine_affinity: False   # True: cosine prototype affinity instead of raw inner product
  r_d: 2              # dilation radius for the RD soft target
  blur_sigma: 1.5
  gamma: 10.0         # boundary band of the RD weighting
  eps: 1.0e-3

optimizer:
  max_epoch: 50
  batch_size: 4
  learning_rate: 1e-5
  weight_decay: 1e-3
  optim_set: "AdamW"
  warmup: False
  warmup_steps: 3

  AdamW:
    target: torch.optim.AdamW
    max_iter: -1
    warmup_iter: -1
    lr_scheduler: "lambda"

storage:
  log_dir: /path/to/save/weights
  preweights_dir: /path/to/the/pretrained/weights
  data_dir: /path/to/the/datasets
  dataset_split_txt_dir: /path/to/the/split/text/file
